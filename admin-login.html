<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Our Family Heritage</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <header>

        <h1>Family Heritage</h1>

        <p>Administrator Login</p>

    </header>


    <main>

        <section class="admin-login-section">

            <div class="admin-login-card">

                <h2>Administrator Login</h2>

                <p>
                    Sign in to manage the family heritage records.
                </p>


                <form id="adminLoginForm">

                    <label for="adminEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter administrator email"
                        required
                    >


                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter password"
                        required
                    >


                    <button
                        type="submit"
                        class="admin-primary-button"
                    >
                        Login
                    </button>


                    <p id="loginMessage"></p>

                </form>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Our Family Heritage
        </p>

    </footer>


    <script
        type="module"
        src="js/admin-login.js"
    ></script>

</body>

</html>
