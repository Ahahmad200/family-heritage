<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administrator Login | Our Family Heritage</title>

<link rel="stylesheet" href="css/style.css">

</head><body><!-- WEBSITE HEADER -->
<header class="site-header">

    <div class="header-content">

        <div class="site-brand">

            <h1>Our Family Heritage</h1>

            <p>Our Roots • Our Story • Our Generations</p>

        </div>

        <!-- PUBLIC NAVIGATION -->
        <nav class="main-navigation">

            <a href="index.html">Home</a>

            <a href="family-tree.html">Family Tree</a>

            <a href="annals.html">Family Annals</a>

        </nav>

    </div>

</header>


<!-- ADMINISTRATOR LOGIN -->
<main>

    <section class="admin-login-section">

        <div class="admin-login-card">

            <h2>Administrator Login</h2>

            <p>
                Sign in securely to manage the family
                heritage records.
            </p>

            <form id="adminLoginForm">

                <label for="adminEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter administrator email"
                    required
                >

                <label for="adminPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter password"
                    required
                >

                <button
                    type="submit"
                    class="admin-primary-button"
                >
                    Login
                </button>

                <p id="loginMessage"></p>

            </form>

            <p class="login-back-link">
                <a href="index.html">
                    ← Back to Family Heritage
                </a>
            </p>

        </div>

    </section>

</main>


<!-- WEBSITE FOOTER -->
<footer class="site-footer">

    <p>
        © 2026 Our Family Heritage. All Rights Reserved.
    </p>

</footer>


<!-- EXISTING LOGIN JAVASCRIPT -->
<script type="module" src="js/admin-login.js"></script>

</body></html>
