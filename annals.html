<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Family Annals | Our Family Heritage</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- ============================= -->
    <!-- HEADER -->
    <!-- ============================= -->

    <header>

        <h1>
            Our Family Annals
        </h1>

        <p>
            Our History • Our Memories • Our Legacy
        </p>

    </header>


    <!-- ============================= -->
    <!-- MAIN CONTENT -->
    <!-- ============================= -->

    <main>

        <section class="family-annals-section">


            <div class="annals-introduction">

                <span class="annals-icon">
                    📜
                </span>

                <h2>
                    The Story of Our Family
                </h2>

                <p>
                    A collection of important moments,
                    memories and events that shaped
                    our family across generations.
                </p>

            </div>


            <!-- ============================= -->
            <!-- ANNALS TIMELINE -->
            <!-- ============================= -->

            <div
                id="familyAnnals"
                class="family-annals-timeline"
            >

                <div class="annals-loading">

                    <div class="annals-loading-icon">
                        📖
                    </div>

                    <p>
                        Loading family history...
                    </p>

                </div>

            </div>


        </section>

    </main>


    <!-- ============================= -->
    <!-- FOOTER -->
    <!-- ============================= -->

    <footer>

        <p>
            © 2026 Our Family Heritage
        </p>

    </footer>


    <!-- ============================= -->
    <!-- JAVASCRIPT -->
    <!-- ============================= -->

    <script
        type="module"
        src="js/annals.js"
    ></script>


</body>

  </html>
