<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Family Tree | Our Family Heritage</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header>

        <h1>Our Family Tree</h1>

        <p>Our Roots • Our Branches • Our Generations</p>

    </header>

<!-- MEMBER BIOGRAPHY POPUP -->

<div id="memberModal" class="member-modal">

    <div class="member-modal-content">

        <button
            id="closeMemberModal"
            class="close-member-modal">
            ×
        </button>

        <div id="modalMemberContent">
        </div>

    </div>

</div>
    <main>

        <section class="family-tree-section">

            <h2>Family Tree</h2>

            <p class="tree-intro">
                Explore our family connections and discover
                how each member is connected to the family.
            </p>
<div class="family-branch-legend">

    <div class="family-branch-legend-title">
        🌳 Family Branches
    </div>

    <div class="family-branch-item family-branch-main">
        <span class="family-branch-dot"></span>
        Main Family Branch
    </div>

    <div class="family-branch-item family-branch-previous">
        <span class="family-branch-dot"></span>
        Previous Marriage Branch
    </div>

</div>

            <div id="familyTree">

                <p>Loading family tree...</p>

            </div>

        </section>
        

    </main>


    <footer>

        <p>© 2026 Our Family Heritage</p>

    </footer>


    <script type="module" src="js/family-tree.js"></script>

</body>

</html>
